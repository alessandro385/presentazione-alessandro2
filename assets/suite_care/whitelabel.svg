<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Illustrazione schematica del white label: un solo colore di marchio genera la palette, e il widget della chat cambia aspetto di conseguenza</title>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="400" rx="16" fill="#f4f7fb"/>

  <!-- profilo azienda -->
  <g transform="translate(28 40)">
    <rect width="200" height="230" rx="14" fill="#fff" stroke="#dbe3ee"/>
    <text x="18" y="32" font-size="12" font-weight="700" fill="#0f172a">Profilo azienda</text>
    <g font-size="10" fill="#64748b">
      <text x="18" y="60">Nome</text>
      <rect x="18" y="66" width="164" height="22" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="108">Colore del marchio</text>
      <rect x="18" y="114" width="164" height="22" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="24" y="118" width="14" height="14" rx="4" fill="#0f766e"/>
      <text x="18" y="156">Orari, tono, logo</text>
      <rect x="18" y="162" width="164" height="22" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="18" y="196" width="76" height="22" rx="7" fill="#0f766e"/>
      <text x="56" y="211" text-anchor="middle" fill="#fff" font-weight="700">Salva</text>
    </g>
  </g>

  <path d="M228 155 H262" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- palette derivata -->
  <g transform="translate(268 40)">
    <rect width="132" height="230" rx="14" fill="#fff" stroke="#dbe3ee"/>
    <text x="16" y="32" font-size="12" font-weight="700" fill="#0f172a">--brand</text>
    <rect x="16" y="46" width="100" height="40" rx="9" fill="#0f766e"/>
    <rect x="16" y="94" width="100" height="26" rx="7" fill="#14b8a6"/>
    <rect x="16" y="126" width="100" height="26" rx="7" fill="#99f6e4"/>
    <rect x="16" y="158" width="100" height="26" rx="7" fill="#ccfbf1"/>
    <rect x="16" y="190" width="100" height="26" rx="7" fill="#f0fdfa" stroke="#e2e8f0"/>
  </g>

  <path d="M400 155 H434" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- widget A -->
  <g transform="translate(440 28)">
    <rect width="172" height="160" rx="16" fill="#fff" stroke="#dbe3ee"/>
    <rect width="172" height="40" rx="16" fill="#0f766e"/>
    <rect y="24" width="172" height="16" fill="#0f766e"/>
    <circle cx="22" cy="20" r="9" fill="#fff" opacity=".9"/>
    <rect x="38" y="16" width="70" height="7" rx="3.5" fill="#fff" opacity=".9"/>
    <rect x="12" y="54" width="110" height="26" rx="10" fill="#f1f5f9"/>
    <rect x="52" y="88" width="108" height="26" rx="10" fill="#ccfbf1"/>
    <rect x="12" y="124" width="148" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <!-- widget B (altro brand) -->
  <g transform="translate(440 212)">
    <rect width="172" height="160" rx="16" fill="#fff" stroke="#dbe3ee"/>
    <rect width="172" height="40" rx="16" fill="#be185d"/>
    <rect y="24" width="172" height="16" fill="#be185d"/>
    <circle cx="22" cy="20" r="9" fill="#fff" opacity=".9"/>
    <rect x="38" y="16" width="70" height="7" rx="3.5" fill="#fff" opacity=".9"/>
    <rect x="12" y="54" width="110" height="26" rx="10" fill="#f1f5f9"/>
    <rect x="52" y="88" width="108" height="26" rx="10" fill="#fce7f3"/>
    <rect x="12" y="124" width="148" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <text x="28" y="320" font-size="12" font-weight="700" fill="#0f172a">Stesso codice, marchi diversi.</text>
  <text x="28" y="340" font-size="10.5" fill="#64748b">Nome, colori e testi stanno nelle impostazioni,</text>
  <text x="28" y="356" font-size="10.5" fill="#64748b">non nei componenti.</text>
</svg>
