<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Illustrazione schematica di un flusso di Care Marketing: evento Shopify, regole di invio, messaggio WhatsApp, eventi verso Klaviyo</title>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .lbl { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 10px; fill: #64748b; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="400" rx="16" fill="#f4f7fb"/>

  <!-- evento -->
  <g transform="translate(28 46)">
    <rect width="164" height="78" rx="14" fill="#fff" stroke="#dbe3ee"/>
    <rect x="14" y="16" width="30" height="30" rx="8" fill="#ecfccb"/>
    <path d="M22 26h14l-2 12h-10z" fill="none" stroke="#65a30d" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M25 26a4 4 0 0 1 8 0" fill="none" stroke="#65a30d" stroke-width="2.4"/>
    <text x="54" y="30" class="lbl">Evento Shopify</text>
    <text x="54" y="45" class="sub">checkout, ordine,</text>
    <text x="54" y="58" class="sub">cliente nuovo</text>
  </g>

  <path d="M192 85 H232" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- regole -->
  <g transform="translate(236 22)">
    <rect width="176" height="210" rx="14" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
    <text x="16" y="28" class="lbl">Regole di invio</text>
    <text x="16" y="43" class="sub">funzione pura, fail-closed</text>
    <g font-size="11" fill="#334155">
      <g transform="translate(16 62)"><circle cx="7" cy="7" r="7" fill="#ccfbf1"/><path d="M3.5 7l2.5 2.5 4.5-5" stroke="#0f766e" stroke-width="1.8" fill="none"/><text x="20" y="11">Consenso del canale</text></g>
      <g transform="translate(16 86)"><circle cx="7" cy="7" r="7" fill="#ccfbf1"/><path d="M3.5 7l2.5 2.5 4.5-5" stroke="#0f766e" stroke-width="1.8" fill="none"/><text x="20" y="11">Esclusioni e STOP</text></g>
      <g transform="translate(16 110)"><circle cx="7" cy="7" r="7" fill="#ccfbf1"/><path d="M3.5 7l2.5 2.5 4.5-5" stroke="#0f766e" stroke-width="1.8" fill="none"/><text x="20" y="11">Fascia oraria</text></g>
      <g transform="translate(16 134)"><circle cx="7" cy="7" r="7" fill="#ccfbf1"/><path d="M3.5 7l2.5 2.5 4.5-5" stroke="#0f766e" stroke-width="1.8" fill="none"/><text x="20" y="11">Limite di frequenza</text></g>
      <g transform="translate(16 158)"><circle cx="7" cy="7" r="7" fill="#fef3c7"/><path d="M7 3.5v4.5M7 10.2v.3" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/><text x="20" y="11">Conversazione aperta?</text></g>
      <g transform="translate(16 182)"><text x="20" y="9" class="sub">→ trattieni o scarta</text></g>
    </g>
  </g>

  <path d="M412 85 H448" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- WhatsApp -->
  <g transform="translate(452 22)">
    <rect width="160" height="210" rx="22" fill="#fff" stroke="#dbe3ee"/>
    <rect x="12" y="12" width="136" height="30" rx="10" fill="#dcfce7"/>
    <circle cx="30" cy="27" r="8" fill="#16a34a"/>
    <text x="44" y="31" font-size="11" font-weight="700" fill="#14532d">WhatsApp</text>
    <rect x="16" y="56" width="120" height="78" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="28" y="70" width="92" height="6" rx="3" fill="#86efac"/>
    <rect x="28" y="84" width="80" height="6" rx="3" fill="#86efac"/>
    <rect x="28" y="98" width="60" height="6" rx="3" fill="#86efac"/>
    <rect x="28" y="112" width="70" height="14" rx="7" fill="#16a34a"/>
    <text x="38" y="122" font-size="8.5" font-weight="700" fill="#fff">link tracciato</text>
    <text x="16" y="154" class="sub">Template approvato</text>
    <text x="16" y="168" class="sub">da Meta, Cloud API</text>
    <text x="16" y="182" class="sub">diretta</text>
  </g>

  <!-- risposte -> inbox -->
  <path d="M532 232 V282 H412" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <g transform="translate(236 256)">
    <rect width="176" height="58" rx="14" fill="#fff" stroke="#dbe3ee"/>
    <text x="16" y="25" class="lbl">Inbox delle risposte</text>
    <text x="16" y="42" class="sub">operatore, STOP / START</text>
  </g>

  <!-- Klaviyo facoltativo -->
  <path d="M532 232 V340 H192" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <path d="M110 124 V318" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-start="url(#a)"/>
  <g transform="translate(28 318)">
    <rect width="164" height="58" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="5 4"/>
    <text x="16" y="25" class="lbl">Klaviyo</text>
    <text x="68" y="25" font-size="9" fill="#7c3aed" font-weight="700">facoltativo</text>
    <text x="16" y="42" class="sub">profili, consensi, eventi</text>
  </g>
</svg>
