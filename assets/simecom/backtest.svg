<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Illustrazione schematica del backtest: per ogni zona tre modelli di forecast vengono confrontati con il consuntivo tramite il MAPE, e vince quello con l'errore più basso</title>
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .h { font-size: 12.5px; font-weight: 700; fill: #1f2430; }
    .s { font-size: 10.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="640" height="400" rx="16" fill="#fffdf8"/>

  <!-- modelli -->
  <g transform="translate(28 46)">
    <rect width="196" height="70" rx="14" fill="#fff" stroke="#e7e1d4"/>
    <rect x="16" y="18" width="10" height="34" rx="5" fill="#0e7490"/>
    <text x="38" y="32" class="h">Forecast originale</text>
    <text x="38" y="50" class="s">il dato di partenza</text>
  </g>
  <g transform="translate(28 134)">
    <rect width="196" height="70" rx="14" fill="#fff" stroke="#e7e1d4"/>
    <rect x="16" y="18" width="10" height="34" rx="5" fill="#d97706"/>
    <text x="38" y="32" class="h">Con variazioni</text>
    <text x="38" y="50" class="s">ritocchi manuali o a regole</text>
  </g>
  <g transform="translate(28 222)">
    <rect width="196" height="70" rx="14" fill="#fff" stroke="#e7e1d4"/>
    <rect x="16" y="18" width="10" height="34" rx="5" fill="#7c3aed"/>
    <text x="38" y="32" class="h">Correzione ML</text>
    <text x="38" y="50" class="s">originale + errore previsto</text>
  </g>

  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M224 81 C 256 81, 256 168, 284 168" marker-end="url(#a)"/>
    <path d="M224 169 H284" marker-end="url(#a)"/>
    <path d="M224 257 C 256 257, 256 170, 284 170" marker-end="url(#a)"/>
  </g>

  <!-- confronto -->
  <g transform="translate(290 46)">
    <rect width="322" height="246" rx="14" fill="#fff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="18" y="30" class="h">MAPE per zona vs consuntivo</text>
    <text x="18" y="46" class="s">barra più corta = errore più basso</text>
    <g transform="translate(18 66)">
      <text x="0" y="12" class="s">zona A</text>
      <rect x="62" y="0" width="150" height="8" rx="4" fill="#0e7490"/>
      <rect x="62" y="10" width="128" height="8" rx="4" fill="#d97706"/>
      <rect x="62" y="20" width="96" height="8" rx="4" fill="#7c3aed"/>
      <rect x="226" y="6" width="58" height="18" rx="9" fill="#ede9fe"/>
      <text x="255" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">vince</text>
    </g>
    <g transform="translate(18 118)">
      <text x="0" y="12" class="s">zona B</text>
      <rect x="62" y="0" width="118" height="8" rx="4" fill="#0e7490"/>
      <rect x="62" y="10" width="92" height="8" rx="4" fill="#d97706"/>
      <rect x="62" y="20" width="104" height="8" rx="4" fill="#7c3aed"/>
      <rect x="226" y="6" width="58" height="18" rx="9" fill="#fef3c7"/>
      <text x="255" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">vince</text>
    </g>
    <g transform="translate(18 170)">
      <text x="0" y="12" class="s">zona C</text>
      <rect x="62" y="0" width="134" height="8" rx="4" fill="#0e7490"/>
      <rect x="62" y="10" width="140" height="8" rx="4" fill="#d97706"/>
      <rect x="62" y="20" width="88" height="8" rx="4" fill="#7c3aed"/>
      <rect x="226" y="6" width="58" height="18" rx="9" fill="#ede9fe"/>
      <text x="255" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">vince</text>
    </g>
    <text x="18" y="230" class="s">Report Excel con un foglio per zona</text>
  </g>
  <text x="28" y="344" font-size="10" fill="#9ca3af">illustrazione: barre di esempio, non i risultati del backtest</text>
</svg>
