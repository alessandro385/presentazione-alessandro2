<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Illustrazione schematica di un diagramma di calibrazione: sulle giocate selezionate la frequenza osservata resta sotto la probabilità dichiarata dal modello</title>
  <rect width="640" height="400" rx="16" fill="#0c1526"/>
  <g stroke-width="1"><path d="M90.0 330 V70" stroke="#1e2d45"/><path d="M90 330.0 H350" stroke="#1e2d45"/><path d="M142.0 330 V70" stroke="#1e2d45"/><path d="M90 278.0 H350" stroke="#1e2d45"/><path d="M194.0 330 V70" stroke="#1e2d45"/><path d="M90 226.0 H350" stroke="#1e2d45"/><path d="M246.0 330 V70" stroke="#1e2d45"/><path d="M90 174.0 H350" stroke="#1e2d45"/><path d="M298.0 330 V70" stroke="#1e2d45"/><path d="M90 122.0 H350" stroke="#1e2d45"/><path d="M350.0 330 V70" stroke="#1e2d45"/><path d="M90 70.0 H350" stroke="#1e2d45"/></g>
  <path d="M90 330 L350 70" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M155.0 283.2 L168.0 271.0 L181.0 258.8 L194.0 246.5 L207.0 234.3 L220.0 222.1 L233.0 209.9 L246.0 197.7 L259.0 185.4 L272.0 173.2 L285.0 161.0" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="155.0" cy="283.2" r="4" fill="#f97316"/><circle cx="181.0" cy="258.8" r="4" fill="#f97316"/><circle cx="207.0" cy="234.3" r="4" fill="#f97316"/><circle cx="233.0" cy="209.9" r="4" fill="#f97316"/><circle cx="259.0" cy="185.4" r="4" fill="#f97316"/><circle cx="285.0" cy="161.0" r="4" fill="#f97316"/>
  <path d="M90 330 H350 M90 330 V70" stroke="#5b7a8f" stroke-width="1.5"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8aa3b5">
    <text x="220.0" y="360" text-anchor="middle">probabilità dichiarata dal modello</text>
    <text x="60" y="200.0" text-anchor="middle" transform="rotate(-90 60 200.0)">frequenza osservata</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
    <path d="M394 92 h22" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5"/><text x="424" y="96">calibrazione perfetta</text>
    <path d="M394 120 h22" stroke="#f97316" stroke-width="3"/><text x="424" y="124">giocate selezionate</text>
    <text x="394" y="172" font-weight="700" fill="#f8fafc">Dove il modello è in</text>
    <text x="394" y="190" font-weight="700" fill="#f8fafc">disaccordo col mercato,</text>
    <text x="394" y="208" font-weight="700" fill="#f8fafc">di solito sbaglia lui.</text>
    <text x="394" y="236">È un effetto di selezione:</text>
    <text x="394" y="254">nessuna ricalibrazione</text>
    <text x="394" y="272">lo corregge.</text>
    <text x="394" y="330" font-size="10" fill="#64748b">schema qualitativo,</text>
    <text x="394" y="344" font-size="10" fill="#64748b">non i valori del report</text>
  </g>
</svg>
